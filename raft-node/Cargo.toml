[package]
name = "raft-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP Server
rocket = { version = "0.5.1", features = ["json"] }

# HTTP Client (blocking mode)
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
crossbeam-channel = "0.5"

# Random (for election timeout)
rand = "0.8"

[dev-dependencies]
# Testing utilities
# (none currently)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
